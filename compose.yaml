x-common-env: &common-env
  NUM_USERS: 1000
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ecommerce
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  
services: 
  postgres:
    image: postgres:16.9
    ports:
      - "5432:5432"
    mem_limit: 512m
    cpus: "0.5"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d airflow && pg_isready -U admin -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    
  dataset-init:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
    command: >
      bash -c "
        python scripts/bootstrap.py
      "
      
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    ports:
      - "9092:9092"
      - "9101:9101"
    mem_limit: 768m
    cpus: "1.5"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    profiles: [elastic]
    ports:
      - "9200:9200"
    mem_limit: 1g
    cpus: "1.0"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    
  event-consumer-to-elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.consumer.elasticsearch
    profiles: [elastic]
    mem_limit: 384m
    cpus: "0.5"
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      dataset-init:
        condition: service_completed_successfully
    command: python services/event_consumer_to_elasticsearch.py
    restart: unless-stopped
      
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.0
    profiles: [elastic]
    ports:
      - "5601:5601"
    mem_limit: 1g
    cpus: "0.25"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=768

  event-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    mem_limit: 256m
    cpus: "0.5"
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      dataset-init:
        condition: service_completed_successfully
    command: python services/event_producer.py
    restart: unless-stopped

  event-consumer-to-postgresql:
    build:
      context: .
      dockerfile: Dockerfile.consumer.postgresql
    profiles: [airflow]
    mem_limit: 384m
    cpus: "0.5"
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      dataset-init:
        condition: service_completed_successfully
    command: python services/event_consumer_to_postgresql.py
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    profiles: [airflow]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://admin:admin@postgres:5432/airflow
      AIRFLOW_CONN_ECOMMERCE_DB: postgresql://admin:admin@postgres:5432/ecommerce
    command: >
      bash -c "
        set -euo pipefail;
        airflow db migrate;
        airflow db check;
        airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true
      "

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: [airflow]
    mem_limit: 768m
    cpus: "1.0"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://admin:admin@postgres:5432/airflow
      AIRFLOW_CONN_ECOMMERCE_DB: postgresql://admin:admin@postgres:5432/ecommerce
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
      AIRFLOW__WEBSERVER__WORKER_REFRESH_NUM_WORKERS: 1
      AIRFLOW__WEBSERVER__WORKERS: 1
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: scheduler
    
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: [airflow]
    ports:
      - "8080:8080"
    mem_limit: 768m
    cpus: "0.75"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://admin:admin@postgres:5432/airflow
      AIRFLOW_CONN_ECOMMERCE_DB: postgresql://admin:admin@postgres:5432/ecommerce
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
      AIRFLOW__WEBSERVER__WORKER_REFRESH_NUM_WORKERS: 1
      AIRFLOW__WEBSERVER__WORKERS: 1
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: webserver

volumes:
  airflow_logs:
  elasticsearch_data:
  kafka_data:
  postgres_data: